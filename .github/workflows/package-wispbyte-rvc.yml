name: Package Wispbyte RVC sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "install_rvc.py"
      - "rvc_adapter.py"
      - "rvc_stage.py"
      - "rvc_models.json"
      - "rvc_drive_support.py"
      - "tests/**"
      - ".github/workflows/package-wispbyte-rvc.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python files and catalog
        run: |
          python -m py_compile install_rvc.py rvc_adapter.py rvc_stage.py rvc_drive_support.py
          python -m json.tool rvc_models.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Create Wispbyte sync package
        run: |
          mkdir -p dist
          cp install_rvc.py rvc_adapter.py rvc_stage.py rvc_models.json rvc_drive_support.py dist/
          tar -czf juliette-wispbyte-rvc-sync.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: juliette-wispbyte-rvc-sync
          path: juliette-wispbyte-rvc-sync.tar.gz
          if-no-files-found: error
